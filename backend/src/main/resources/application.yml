spring:
  application:
    name: kanary

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskmanager}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER:taskuser}
    password: ${DB_PASSWORD:taskpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  jwt:
    # en prod: passer JWT_SECRET en variable d'env (32 caractères minimum, sinon jjwt refuse la clé)
    secret: ${JWT_SECRET:change-me-in-production-with-a-very-long-secret-key-123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
