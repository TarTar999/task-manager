server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # sans ce fallback, un F5 sur /login renvoie un 404 nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # les assets ont un hash dans le nom, on peut cacher à fond
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
